[project]
name = "financial-rag-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Varshitha", email = "varshithachappidi23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.0",
    "langgraph>=1.2.15",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
]

[project.scripts]
financial-rag-eval = "financial_rag_eval:main"


[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
